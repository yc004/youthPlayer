<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>播出保护</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #1e3a8a 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      user-select: none;
    }
    .title {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 24px;
      text-shadow: 0 8px 24px rgba(15, 23, 42, 0.45);
    }
    .subtitle {
      font-size: 40px;
      font-weight: 600;
      margin: 0;
      opacity: 0.95;
    }
    .hint {
      margin-top: 36px;
      font-size: 24px;
      opacity: 0.75;
      letter-spacing: 1px;
    }
    #license-overlay {
      position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.88);
      display: none; align-items: center; justify-content: center; flex-direction: column;
      color: #f87171; font-size: clamp(18px,3vw,32px); text-align: center; padding: 40px;
    }
    #license-overlay.show { display: flex; }
    #license-overlay .lic-icon { font-size: 64px; margin-bottom: 20px; }
    #license-overlay .lic-title { font-weight: 700; margin-bottom: 12px; }
    #license-overlay .lic-detail { font-size: 0.7em; opacity: 0.85; max-width: 600px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">播出系统运行中</p>
    <p class="subtitle">请勿干扰</p>
    <p class="hint">NON-BROADCAST SCREEN</p>
  </div>
  <div id="license-overlay">
    <div class="lic-icon">⚠️</div>
    <div class="lic-title">证书已过期</div>
    <div class="lic-detail" id="lic-detail">系统未激活，请联系管理员更新证书。</div>
  </div>
  <script>
    var apiBase = new URLSearchParams(location.search).get("api_base") || "http://127.0.0.1:5000";
    (function checkLicense() {
      try {
        var x = new XMLHttpRequest();
        x.open("GET", apiBase + "/api/license/status", true);
        x.onload = function () {
          if (x.status === 200) {
            try {
              var r = JSON.parse(x.responseText);
              var lic = r.license;
              var ov = document.getElementById("license-overlay");
              var detail = document.getElementById("lic-detail");
              if (lic && !lic.valid) {
                if (ov) ov.classList.add("show");
                if (detail) detail.textContent = lic.error || "系统未激活，请联系管理员更新证书。";
              } else {
                if (ov) ov.classList.remove("show");
              }
            } catch (_) {}
          }
        };
        x.send();
      } catch (_) {}
      setTimeout(checkLicense, 60000);
    })();
  </script>
</body>
</html>
